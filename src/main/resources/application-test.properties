spring.application.name=demo-test

# Use H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Let Hibernate create the tables
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Keycloak during tests
keycloak.enabled=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/auth/realms/test

# Disable RabbitMQ for tests
spring.rabbitmq.listener.simple.auto-startup=false