services:
  db:
    image: postgres
    container_name: my_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: tasksms
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d tasksms -U yurii" ]
      interval: 1s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  tasks:
    build:
      context: .
      dockerfile: ./Docker/Dockerfile
    image: melmn/tasks:latest
    ports:
      - "5002:8080"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${PG_USER}:${PG_PASSWORD}@db:5432/tasksms