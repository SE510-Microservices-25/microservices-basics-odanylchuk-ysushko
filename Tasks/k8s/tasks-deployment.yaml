apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks
  labels:
    io.kompose.service: tasks
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: tasks
  template:
    metadata:
      labels:
        io.kompose.service: tasks
    spec:
      containers:
        - name: tasks
          image: melmn/tasks:latest
          ports:
            - containerPort: 8080
          env:
            - name: PG_USER
              valueFrom:
                configMapKeyRef:
                  name: env
                  key: PG_USER
            - name: PG_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: env
                  key: PG_PASSWORD
            - name: DATABASE_URL
              value: "postgres://yurii:1488@db:5432/tasksms"
            - name: ASPNETCORE_URLS
              value: "http://*:5002"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
          imagePullPolicy: Always
