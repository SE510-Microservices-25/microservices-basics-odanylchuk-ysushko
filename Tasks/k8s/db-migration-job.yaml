apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
spec:
  template:
    spec:
      containers:
        - name: migrate
          image: melmn/tasks:latest
          # Wait 10 seconds to allow DNS resolution and service readiness, then run the migration
          command: ["sh", "-c", "sleep 10 && dotnet Tasks.dll migrate"]
          env:
            - name: DATABASE_URL
              value: "Host=db;Port=5432;Username=yurii;Password=1488;Database=tasksms"
            - name: PG_USER
              valueFrom:
                configMapKeyRef:
                  name: env
                  key: PG_USER
            - name: PG_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: env
                  key: PG_PASSWORD
      restartPolicy: OnFailure
  backoffLimit: 3
